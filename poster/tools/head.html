<!doctype html><html><head><meta charset=utf8>
<style>
:root{--ground:#f2f0ec;--panel:#ffffff;--ink:#1b2430;--ink-soft:#5d6875;--rule:#d8d4cc;--string:#c2452d;--arm:#8d97a3;--curve:#1b6b7d;--warn:#b0741a;--grid:#e4e0d8;--font-ui:"Noto Sans CJK KR",sans-serif;--font-num:"DejaVu Sans Mono",monospace;color-scheme:light}
*{box-sizing:border-box}body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);margin:0;padding:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:16px;width:620px;margin-bottom:16px}
.card h2{font-size:12px;font-weight:600;letter-spacing:.11em;color:var(--ink-soft);margin:0 0 12px}
svg{display:block;width:100%;height:auto}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.cell{background:var(--panel);padding:9px 10px}.cell .k{font-size:11px;color:var(--ink-soft);display:block}
.cell .v{font-family:var(--font-num);font-size:17px;font-weight:500}.cell .u{font-size:11px;color:var(--ink-soft);margin-left:2px}
.note{font-size:12px;color:var(--ink-soft);margin:10px 0 0}.note b{color:var(--warn)}
.legend{display:flex;gap:13px;font-size:12px;color:var(--ink-soft);margin-top:9px}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
#hidden{display:none}
</style></head><body>
<div class="card" id="cardArm"><h2>측면 형상</h2><svg id="arm" viewBox="0 0 560 320"></svg>
<div class="legend"><span><i style="background:var(--string)"></i>줄</span><span><i style="background:var(--arm)"></i>팔</span><span><i style="background:var(--curve)"></i>모멘트암</span></div></div>
<div class="card" id="cardChart"><h2>굴곡 각도에 따른 변화</h2><svg id="chart" viewBox="0 0 560 280"></svg>
<div class="legend"><span><i style="background:var(--curve)"></i>모멘트암 (cm)</span><span><i style="background:var(--string)"></i>필요 장력 (N)</span><span><i style="background:var(--warn)"></i>모델이 정의되지 않는 구간</span></div><p class="note" id="limitnote"></p></div>
<div class="card" id="cardOut"><h2>출력</h2><div class="read" id="out"></div><p class="note" id="outnote"></p></div>
<div id="hidden"><div id="mode"><button data-m="straight" aria-pressed="true">직선</button></div>
<div id="c-theta"></div><div id="c-attach"></div><div id="c-motor"></div><div id="c-pulley"></div><div id="c-rfore"></div><div id="c-rupper"></div><div id="c-protr"></div><div id="c-fore"></div><div id="c-upper"></div><div id="c-axilla"></div><div id="c-srad"></div><div id="c-strand"></div><div id="c-hub"></div><div id="c-twist"></div><div id="c-assist"></div><div id="c-weight"></div><div id="c-time"></div></div>
